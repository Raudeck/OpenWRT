name: TR3000 OpenWRT
on:
  workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: maximize build space
        uses: justinthelaw/maximize-github-runner-space@main
        with:
          cleanup-profile: max
          skip-components: gh-cli
      - name: checkout
        uses: actions/checkout@v4
      - name: install build dependencies
        run: |
          sudo apt update
          sudo apt install build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
          python3-setuptools rsync swig unzip zlib1g-dev file wget
      - name: fetch OpenWRT source
        run: |
            git clone -b openwrt-25.12 --single-branch https://git.openwrt.org/openwrt/openwrt.git
      - name: build
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          curl -sSL https://raw.githubusercontent.com/mufeng05/turboacc/main/add_turboacc.sh -o add_turboacc.sh && bash add_turboacc.sh
          cp ../.config-tr3000 .config
          make -j3 V=s defconfig download clean world
          cd .. && mkdir -p release
          cd openwrt
          find bin/targets -iname "*-sysupgrade*" -exec cp {} ../release \;
      - name: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create TR3000
          gh release upload TR3000 release/*-sysupgrade*